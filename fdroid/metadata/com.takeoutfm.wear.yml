Name: TakeoutFM for Wear OS
Summary: Watch client for TakeoutFM

Description: >
  TakeoutFM is a self-hosted free software media system. Enjoy your media on
  your phone, desktop, television, and watch. Store your media at home, in the
  cloud, and run the server anywhere.
  <p>
  TakeoutFM for Wear OS supports Music, Internet Radio, Podcasts and Downloads
  for offline playback, with a Tile and a watch face complication.
